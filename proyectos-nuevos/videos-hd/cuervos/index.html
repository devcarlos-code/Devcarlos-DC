<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Una edición de anime de acción con energía, tensión y una puesta en escena vibrante."
    />
    <meta name="theme-color" content="#080b12" />
    <title>Cuervos — Anime de acción | DevCarlos</title>
    <link rel="stylesheet" href="../video-pages.css" />
  </head>
  <body data-theme="cuervos">
    <header class="site-header">
      <a class="brand" href="../../../index.html#proyectos" aria-label="DevCarlos, volver a proyectos">
        <span class="brand-mark" aria-hidden="true">DC</span>
        <span>DEVCARLOS</span>
      </a>
      <a class="back-link" href="../../../index.html#proyectos">Volver al portafolio</a>
    </header>
    <main>
      <section class="welcome" id="welcome" aria-labelledby="page-title">
        <p class="eyebrow">Video destacado · 03</p>
        <h1 id="page-title">Cuervos</h1>
        <p class="description">
          Una edición de anime de acción con energía, tensión y una puesta en escena vibrante.
        </p>
        <div class="welcome-footer">
          <button class="play-button" id="play-video" type="button">
            <span class="play-icon" aria-hidden="true">▶</span>
            <span>Ver video</span>
          </button>
          <span class="hint">Activa el sonido y disfruta el clip.</span>
        </div>
      </section>
      <section class="player-panel" id="player-panel" aria-label="Reproductor de Cuervos" hidden>
        <div class="player-topline">
          <h2 class="player-title">Cuervos</h2>
          <span class="live-label" id="playback-label">Listo para reproducir</span>
        </div>
        <video id="video" controls playsinline preload="metadata" loop>
          <source src="item4.mp4" type="video/mp4" />
          Tu navegador no admite la reproducción de video HTML5.
        </video>
        <p class="playback-status" id="playback-status" role="status" aria-live="polite"></p>
      </section>
    </main>
    <script src="../video-player.js" defer></script>
  </body>
</html>
