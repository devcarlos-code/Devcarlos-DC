      .rays {
        position: absolute;
        inset: -25%;
        mix-blend-mode: screen;
        pointer-events: none;
        transition:
          opacity 1.6s,
          transform 2.8s;
        background:
          repeating-conic-gradient(
            from 196deg at 80% 6%,
            transparent 0 3deg,
            rgba(255, 214, 140, 0.17) 3.6deg 4.6deg,
            transparent 5.4deg 8.5deg
          ),
          repeating-conic-gradient(
            from 205deg at 78% 4%,
            transparent 0 5deg,
            rgba(255, 230, 170, 0.13) 5.8deg 7deg,
            transparent 8deg 13deg
          );
        -webkit-mask-image: radial-gradient(
          ellipse at 80% 6%,
          #000 0,
          transparent 80%
        );
        mask-image: radial-gradient(ellipse at 80% 6%, #000 0, transparent 80%);
        animation: ray 14s ease-in-out infinite alternate;
      }
      @keyframes ray {
        from {
          transform: rotate(-1.4deg);
          opacity: 0.6;
        }
        to {
          transform: rotate(1.6deg);
          opacity: 1;
        }
      }
      .fog {
        position: absolute;
        left: -35%;
        right: -35%;
        bottom: 0;
        height: 55%;
        pointer-events: none;
        filter: blur(18px);
        animation: fog 32s ease-in-out infinite alternate;
        background:
          radial-gradient(
            ellipse at 30% 80%,
            rgba(255, 230, 180, 0.38),
            transparent 62%
          ),
          radial-gradient(
            ellipse at 72% 90%,
            rgba(255, 225, 170, 0.32),
            transparent 58%
          ),
          linear-gradient(
            to top,
            rgba(40, 18, 5, 0.22) 0%,
            transparent 45%
          );
      }
      @keyframes fog {
        from {
          transform: translateX(-8%);
        }
        to {
          transform: translateX(8%);
        }
      }
      .warm {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(
          ellipse at 72% 22%,
          rgba(255, 196, 110, 0.22),
          transparent 60%
        );
        animation: flick 5s infinite;
      }
      @keyframes flick {
        0%,
        100% {
          opacity: 1;
        }
        35% {
          opacity: 0.65;
        }
        60% {
          opacity: 0.95;
        }
        80% {
          opacity: 0.7;
        }
      }
      .shade {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          linear-gradient(transparent 38%, rgba(12, 6, 1, 0.7) 82%),
          radial-gradient(
            ellipse at 50% 50%,
            transparent 45%,
            rgba(8, 4, 0, 0.7) 110%
          );
      }
      .content {
        position: absolute;
        left: 0;
        right: 0;
        bottom: calc(8% + env(safe-area-inset-bottom, 0px));
        text-align: center;
        padding: 0 26px;
        color: var(--cream);
        text-shadow:
          0 2px 16px rgba(18, 9, 2, 0.95),
          0 0 3px rgba(18, 9, 2, 0.8);
        animation: rise 2.6s ease 0.5s both;
        transition:
          opacity 1s,
          transform 1.6s;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(22px);
          filter: blur(6px);
        }
        to {
          opacity: 1;
          transform: none;
          filter: none;
        }
      }
      .sub {
        font:
          clamp(26px, 7.4vw, 34px)/1.1 "Pinyon Script",
          cursive;
        color: #ffdfa0;
        margin: 0 0 0.15em;
      }
      h1 {
        margin: 0;
        font:
          700 clamp(30px, 9vw, 46px)/1.15 "Cinzel Decorative",
          Georgia,
          serif;
        letter-spacing: 0.04em;
      }
      .line {
        width: 140px;
        height: 1px;
        margin: 18px auto 0;
        background: linear-gradient(
          90deg,
          transparent,
          var(--gold),
          transparent
        );
      }
      .btn {
        position: relative;
        overflow: hidden;
        margin-top: 26px;
        padding: 15px 50px;
        font:
          700 17px "Cinzel Decorative",
          Georgia,
          serif;
        letter-spacing: 0.14em;
        color: #2a1608;
        text-shadow: none;
        cursor: pointer;
        background: linear-gradient(#f8e0a2, #d4a95a);
        border: 1px solid #fff0c4;
        border-radius: 999px;
        box-shadow:
          0 0 24px rgba(255, 210, 120, 0.5),
          inset 0 1px 0 rgba(255, 255, 255, 0.7);
        animation: glow 3s ease-in-out infinite;
      }
      .btn::after {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        width: 40%;
        left: -60%;
        background: linear-gradient(
          100deg,
          transparent,
          rgba(255, 255, 255, 0.7),
          transparent
        );
        animation: sh 3.6s ease-in-out infinite;
      }
      @keyframes sh {
        0%,
        55% {
          left: -60%;
        }
        100% {
          left: 130%;
        }
      }
      @keyframes glow {
        50% {
          box-shadow:
            0 0 38px rgba(255, 214, 130, 0.85),
            inset 0 1px 0 rgba(255, 255, 255, 0.7);
        }
      }
      .note {
        margin-top: 14px;
        font:
          italic 14px Georgia,
          serif;
        color: #e7cf9c;
        opacity: 0.85;
      }
      .leaving .content {
        opacity: 0;
        transform: translateY(-26px);
      }
      .leaving .bg {
        transform: scale(2.1) translate(-9%, 9%);
        filter: blur(5px) brightness(1.6);
      }
      .leaving .rays {
        opacity: 1;
        transform: scale(1.8);
        animation: none;
      }
      .bloom {
        position: fixed;
        inset: 0;
        z-index: 8;
        pointer-events: none;
        opacity: 0;
        background: radial-gradient(
          circle at 74% 18%,
          #fffbe8,
          #f6dc9c 45%,
          #c99650 100%
        );
      }
      .bloom.in {
        opacity: 1;
        transition: opacity 1.5s ease-in;
      }
      .bloom.out {
        opacity: 0;
        transition: opacity 2.4s ease-out;
      }
      #letter {
        visibility: hidden;
        opacity: 0;
        filter: blur(10px);
        transform: scale(1.05);
        background: #c9a06a;
        cursor: pointer;
      }
      #letter.on {
        visibility: visible;
        opacity: 1;
        filter: none;
        transform: none;
        transition:
          opacity 2.2s,
          filter 2.4s,
          transform 2.8s ease-out;
      }
      #letter::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(
          ellipse at 68% 50%,
          rgba(246, 228, 184, 0.7),
          transparent 66%
        );
      }
      #letter::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        box-shadow: inset 0 0 60px 6px rgba(50, 22, 5, 0.4);
        animation: flick 6s infinite;
      }
      .page {
        position: relative;
        z-index: 1;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 28px 18px 28px 34vw;
        color: var(--ink);
        font-family: "Pinyon Script", "Apple Chancery", cursive;
      }
      .page::before {
        content: "";
        position: absolute;
        z-index: -1;
        left: 29vw;
        right: 1vw;
        top: 6%;
        bottom: 6%;
        border-radius: 40px;
        background: rgba(246, 228, 184, 0.74);
        filter: blur(16px);
      }
      .page h1 {
        margin: 0 0 0.5em;
        font:
          400 clamp(34px, 9.6vw, 48px)/1.1 "Pinyon Script",
          cursive;
        letter-spacing: 0;
      }
      .page h1::after {
        content: "";
        display: block;
        width: 60%;
        height: 1px;
        margin: 0.3em auto 0;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(46, 14, 10, 0.7),
          transparent
        );
      }
      .page p {
        margin: 0;
        max-width: 30em;
        font-size: clamp(21px, 5.8vw, 28px);
        line-height: 1.38;
        letter-spacing: 0.02em;
      }
      .page .sign {
        margin-top: 1em;
        font-size: clamp(24px, 6.6vw, 32px);
      }
      .w {
        display: inline-block;
        white-space: nowrap;
      }
      .c {
        opacity: 0;
        transition: opacity 0.35s;
        text-shadow:
          0 0 7px rgba(246, 228, 184, 0.95),
          0 0 2px rgba(246, 228, 184, 0.9);
      }
      .c.on {
        opacity: 1;
        animation: dry 3s ease-out;
      }
      @keyframes dry {
        from {
          color: #000;
          text-shadow:
            0 0 5px rgba(0, 0, 0, 0.65),
            0 0 7px rgba(246, 228, 184, 0.95),
            0 1px 1px rgba(255, 240, 210, 0.9);
        }
      }
      .hint {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        bottom: calc(22px + env(safe-area-inset-bottom, 0px));
        text-align: center;
        font:
          italic 14px Georgia,
          serif;
        color: rgba(46, 14, 10, 0.78);
        opacity: 0;
        transition: opacity 1.2s ease, transform 1.2s ease;
        pointer-events: none;
        z-index: 2;
        padding: 8px 18px;
        background: rgba(244, 230, 190, 0.55);
        border-radius: 20px;
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        box-shadow: 0 2px 12px rgba(40, 18, 5, 0.12);
        white-space: nowrap;
      }
      .hint.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
      .snd {
        position: fixed;
        z-index: 9;
        top: calc(12px + env(safe-area-inset-top, 0px));
        right: 14px;
        width: 42px;
        height: 42px;
        border-radius: 50%;
        border: 1px solid rgba(46, 14, 10, 0.4);
        background: rgba(246, 228, 184, 0.8);
        color: var(--ink);
        font-size: 20px;
        line-height: 1;
        cursor: pointer;
        display: none;
      }
      .snd.show {
        display: block;
      }
      .snd.off {
        opacity: 0.5;
        text-decoration: line-through;
      }
      @media (min-aspect-ratio: 1/1) {
        .page {
          padding-left: 46vw;
        }
        .page::before {

      .bg {
        translate: calc(var(--px, 0) * -12px) calc(var(--py, 0) * -9px);
      }
      .rays {
        translate: calc(var(--px, 0) * -26px) calc(var(--py, 0) * -16px);
      }
      .fog {
        translate: calc(var(--px, 0) * -36px) 0;
      }
      .page {
        transition:
          opacity 1.4s,
          filter 1.4s;
      }
      .page.dim {
        opacity: 0.12;
        filter: blur(2px);
      }
      .flourish {
        width: 62%;
        height: auto;
        margin-top: 0.2em;
        overflow: visible;
      }
      .flourish path {
        fill: none;
        stroke: #2e0e0a;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-dasharray: 420;
        stroke-dashoffset: 420;
      }
      .flourish.go path {
        transition: stroke-dashoffset 1.8s ease-in-out;
        stroke-dashoffset: 0;
      }
      .seal {
        position: absolute;
        z-index: 3;
        right: 7vw;
        bottom: 11%;
        width: 60px;
        height: 60px;
        border-radius: 48% 52% 50% 50%/52% 48% 52% 48%;
        background: radial-gradient(
          circle at 35% 30%,
          #c23a4a,
          #8f1d2c 60%,
          #5a0f1a
        );
        box-shadow:
          inset 0 0 0 5px rgba(0, 0, 0, 0.14),
          inset 0 -4px 8px rgba(0, 0, 0, 0.35),
          0 6px 10px rgba(30, 5, 5, 0.5);
        display: grid;
        place-items: center;
        opacity: 0;
        pointer-events: none;
      }
      .seal svg {
        width: 28px;
        height: 28px;
        fill: #6b0f1c;
      }
      .seal.on {
        animation: stamp 0.7s cubic-bezier(0.3, 1.4, 0.5, 1) forwards;
      }
      @keyframes stamp {
        0% {
          opacity: 0;
          transform: translateY(-70px) scale(1.9);
        }
        55% {
          opacity: 1;
          transform: translateY(0) scale(1.08);
        }
        78% {
          transform: scale(0.93);
        }
        100% {
          opacity: 1;
          transform: none;
        }
      }
      .final {
        position: fixed;
        z-index: 6;
        left: 0;
        right: 0;
        top: 42%;
        text-align: center;
        padding: 0 24px;
        font:
          400 clamp(46px, 14vw, 78px)/1.05 "Pinyon Script",
          cursive;
        color: #7a1426;
        text-shadow:
          0 0 18px rgba(255, 236, 190, 0.95),
          0 0 4px rgba(255, 236, 190, 0.9);
        opacity: 0;
        pointer-events: none;
        transform: scale(0.82);
        transition:
          opacity 2.2s ease,
          transform 3.4s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .final.on {
        opacity: 1;
        transform: scale(1);
      }
      .quill {
        position: fixed;
        z-index: 6;
        left: 0;
        top: 0;
        width: 56px;
        height: 56px;
        pointer-events: none;
        opacity: 0;
        transition:
          transform 0.12s linear,
          opacity 0.5s;
        filter: drop-shadow(1px 3px 3px rgba(40, 15, 5, 0.45));
      }
      .drop {
        position: fixed;
        z-index: 6;
        width: 8px;
        height: 8px;
        margin: -2px 0 0 -4px;
        border-radius: 50%;
        background: #240a07;
        pointer-events: none;
        animation: drop 1.6s ease-out forwards;
      }
      @keyframes drop {
        0% {
          transform: scale(0.2);
          opacity: 0.9;
        }
        25% {
          transform: scale(1);
          opacity: 0.85;
        }
        100% {
          transform: translateY(5px) scale(1.5, 1.2);
          opacity: 0;
        }
      }
      .env {
        position: absolute;
        z-index: 4;
        left: 50%;
        top: 48%;
        width: min(78vw, 300px);
        height: min(52vw, 200px);
        margin: calc(min(52vw, 200px) / -2) 0 0 calc(min(78vw, 300px) / -2);
        cursor: pointer;
        perspective: 900px;
        filter: drop-shadow(0 14px 18px rgba(40, 18, 5, 0.55));
        animation: float 5s ease-in-out infinite;
        translate: calc(var(--px, 0) * 10px) calc(var(--py, 0) * 8px);
        transition:
          opacity 0.9s,
          transform 1s;
      }
      @keyframes float {
        0%, 100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-14px);
        }
      }
      .env.shake {
        animation: envShake 0.45s ease-in-out;
      }
      @keyframes envShake {
        0%, 100% { transform: translateY(0) rotate(0); }
        20% { transform: translateY(-3px) rotate(-1.2deg); }
        40% { transform: translateY(2px) rotate(1deg); }
        60% { transform: translateY(-2px) rotate(-0.8deg); }
        80% { transform: translateY(1px) rotate(0.5deg); }
      }
      .env.gone {
        animation: none;
        opacity: 0;
        transform: translateY(60px);
        pointer-events: none;
      }
      .env > div {
        position: absolute;
      }
      .eback {
        inset: 0;
        background: #b08b50;
        border-radius: 5px;
      }
      .efront {
        inset: 0;
        z-index: 3;
        background: #d6b878;
        border-radius: 5px;
        clip-path: polygon(0 0, 50% 56%, 100% 0, 100% 100%, 0 100%);
      }
      .efront::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.25),
          transparent 55%
        );
      }
      .eflap {
        left: 0;
        right: 0;
        top: 0;
        height: 56%;
        z-index: 5;
        background: #c4a064;
        clip-path: polygon(0 0, 100% 0, 50% 100%);
        transform-origin: top;
        transition:
          transform 0.7s ease,
          z-index 0s 0.7s;
      }
      .o2 .eflap {
        transform: rotateX(180deg);
        z-index: 1;
        transition:
          transform 0.7s ease,
          z-index 0s 0.35s;
      }
      .ecard {
        left: 8%;
        right: 8%;
        top: 10px;
        height: 78%;
        z-index: 2;
        background:
          url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/><feColorMatrix values='0 0 0 0 .32 0 0 0 0 .2 0 0 0 0 .08 0 0 0 .4 0'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>"),
          radial-gradient(
            ellipse at 40% 30%,
            #f4e6bd 0%,
            #e8d09a 55%,
            #d4b07a 100%
          );
        border-radius: 4px;
        padding: 16px 18px;
        box-shadow:
          0 0 0 1px rgba(120, 80, 30, 0.3),
          inset 0 0 16px 2px rgba(80, 45, 15, 0.2);
        transition:
          transform 1.1s cubic-bezier(0.2, 0.8, 0.2, 1),
          opacity 0.7s ease,
          box-shadow 0.7s ease;
      }
      .ecard i {
        display: block;
        height: 2px;
        margin: 12px 0;
        width: 90%;
        background: rgba(90, 40, 20, 0.28);
        border-radius: 2px;
        transition: opacity 0.5s ease;
      }
      .ecard i:nth-child(2) {

    <script>
      (function () {

          o.connect(e);
          o2.connect(h);
          h.connect(e);
          e.connect(bus);
          o.start(t);
          o2.start(t);
          o.stop(t + d + 0.1);
          o2.stop(t + d + 0.1);
        }
        function pad(ns, t, len) {
          var f = ac.createBiquadFilter();
          f.type = "lowpass";
          f.frequency.value = 650;
          var e = ac.createGain();
          e.gain.setValueAtTime(0, t);
          e.gain.linearRampToValueAtTime(0.05, t + 1);
          e.gain.linearRampToValueAtTime(0, t + len + 0.8);
          f.connect(e);
          e.connect(bus);
          ns.forEach(function (n) {
            [-6, 6].forEach(function (dt) {
              var o = ac.createOscillator();
              o.type = "sawtooth";
              o.frequency.value = mf(n);
              o.detune.value = dt;
              o.connect(f);
              o.start(t);
              o.stop(t + len + 1);
            });
          });
        }
        var CH = [
            [50, 53, 57, 62, 65],
            [48, 52, 55, 60, 64],
            [46, 50, 53, 58, 62],
            [45, 49, 52, 57, 64],
          ],
          MEL = [
            [74, 0, 77, 0, 76, 0, 74, 0],
            [72, 0, 76, 0, 74, 0, 72, 0],
            [70, 0, 74, 0, 72, 0, 70, 0],
            [69, 0, 73, 0, 76, 0, 0, 0],
          ],
          PAT = [0, 3, 2, 4, 2, 3, 1, 3],
          ST = 0.34,
          step = 0,
          next = 0;
        function sched() {
          while (next < ac.currentTime + 0.4) {
            var b = Math.floor(step / 8) % 4,
              s = step % 8,
              c = CH[b];
            if (s === 0) {
              pad([c[0], c[2], c[3]], next, ST * 8);
              pluck(c[0] - 12, next, 0.16, 2.2);
            }
            pluck(c[PAT[s]], next, 0.1, 1.1);
            var m = MEL[b][s];
            if (m) pluck(m, next + 0.005, 0.17, 1.6);
            next += ST;
            step++;
          }
        }
        var nb;
        function noise() {
          if (!nb) {
            var n = ac.sampleRate * 2;
            nb = ac.createBuffer(1, n, ac.sampleRate);
            var d = nb.getChannelData(0);
            for (var i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
          }
          var s = ac.createBufferSource();
          s.buffer = nb;
          return s;
        }
        function bp(fr, q) {
          var f = ac.createBiquadFilter();
          f.type = "bandpass";
          f.frequency.value = fr;
          f.Q.value = q;
          return f;
        }
        function wind() {
          var s = noise();
          s.loop = true;
          var f = bp(420, 0.7),
            g = ac.createGain();
          g.gain.value = 0.05;
          var l = ac.createOscillator();
          l.frequency.value = 0.08;
          var lg = ac.createGain();
          lg.gain.value = 220;
          l.connect(lg);
          lg.connect(f.frequency);
          var l2 = ac.createOscillator();
          l2.frequency.value = 0.13;
          var lg2 = ac.createGain();
          lg2.gain.value = 0.03;
          l2.connect(lg2);
          lg2.connect(g.gain);
          s.connect(f);
          f.connect(g);
          g.connect(master);
          s.start();
          l.start();
          l2.start();
        }
        function paper() {
          if (!ac) return;
          var t = ac.currentTime,
            s = noise(),
            f = bp(2800, 0.8),
            g = ac.createGain();
          g.gain.setValueAtTime(0, t);
          for (var i = 0; i < 9; i++) {
            var u = t + i * 0.09 + Math.random() * 0.06;
            g.gain.setValueAtTime(0, u);
            g.gain.linearRampToValueAtTime(
              0.05 + Math.random() * 0.05,
              u + 0.01,
            );
            g.gain.linearRampToValueAtTime(0, u + 0.05);
          }
          s.connect(f);
          f.connect(g);
          g.connect(master);
          s.start(t, Math.random());
          s.stop(t + 1.2);
        }
        function whoosh() {
          if (!ac) return;
          var t = ac.currentTime,
            s = noise(),
            f = bp(250, 0.9);
          f.frequency.setValueAtTime(250, t);
          f.frequency.exponentialRampToValueAtTime(2400, t + 2.6);
          var g = ac.createGain();
          g.gain.setValueAtTime(0, t);
          g.gain.linearRampToValueAtTime(0.16, t + 1.8);
          g.gain.linearRampToValueAtTime(0, t + 3.2);
          s.connect(f);
          f.connect(g);
          g.connect(master);
          s.start(t);
          s.stop(t + 3.3);
        }
        function scratch() {
          if (!ac || muted) return;
          var t = ac.currentTime,
            s = noise(),
            f = bp(2200 + Math.random() * 1200, 1.2),
            g = ac.createGain();
          g.gain.setValueAtTime(0.045, t);
          g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
          s.connect(f);
          f.connect(g);
          g.connect(master);
          s.start(t, Math.random() * 1.5);
          s.stop(t + 0.06);
        }
        function thud() {
          if (!ac) return;
          var t = ac.currentTime,
            o = ac.createOscillator(),
            g = ac.createGain();
          o.frequency.setValueAtTime(130, t);
          o.frequency.exponentialRampToValueAtTime(48, t + 0.25);
          g.gain.setValueAtTime(0.45, t);
          g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
          o.connect(g);
          g.connect(master);
          o.start(t);
          o.stop(t + 0.4);
        }
        function chime() {
          if (ac) pluck(88, ac.currentTime, 0.09, 1.8);
        }
        function chimeSoft() {
          if (!ac) return;
          var o = [0, 3, 7, 10, 12];
          for (var i = 0; i < 5; i++)
            pluck(76 + o[i], ac.currentTime + i * 0.2, 0.07, 2.4);
        }
        function startMusic() {
          if (started) return;
          started = true;
          var AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          ac = new AC();
          if (ac.resume) ac.resume();
          master = ac.createGain();
          master.gain.setValueAtTime(0, ac.currentTime);
          master.gain.linearRampToValueAtTime(0.85, ac.currentTime + 4);
          var lp = ac.createBiquadFilter();
          lp.type = "lowpass";
          lp.frequency.value = 3200;
          bus = ac.createGain();
          bus.connect(lp);
          var rv = ac.createConvolver(),
            n = ac.sampleRate * 2.6,
            buf = ac.createBuffer(2, n, ac.sampleRate);
          for (var ch = 0; ch < 2; ch++) {
            var d = buf.getChannelData(ch);
            for (var i = 0; i < n; i++)
              d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2.6);
          }
          rv.buffer = buf;
          var wet = ac.createGain();
          wet.gain.value = 0.45;
          lp.connect(master);
          lp.connect(rv);
          rv.connect(wet);
          wet.connect(master);
          master.connect(ac.destination);
          next = ac.currentTime + 0.1;
          sched();
          setInterval(sched, 120);
          wind();
        }
        $("snd").addEventListener("click", function (e) {
          e.stopPropagation();
          muted = !muted;
          this.classList.toggle("off", muted);
          if (master)
            master.gain.setTargetAtTime(muted ? 0 : 0.85, ac.currentTime, 0.3);
        });

        var chars = [],
          timer = null,
          hint = $("hint");
        document.querySelectorAll("[data-t]").forEach(function (el) {
          var ws = el.getAttribute("data-t").split(" ");
          ws.forEach(function (w, i) {
            var s = document.createElement("span");
            s.className = "w";
            var L = w.replace(/[^a-záéíóúñ]/gi, "").length,
              kw =
                el.tagName !== "H1" &&
                /^(universo|corazón|infinito|estrellas)$/.test(
                  w.replace(/[^a-záéíóúñ]/gi, "").toLowerCase(),
                );
            if (kw) s.className = "w kw";
            w.split("").forEach(function (ch, j) {
              var c = document.createElement("span");
              c.className = "c";
              c.textContent = ch;
              if (kw && j === L - 1) c.dataset.kw = "1";
              s.appendChild(c);
              chars.push(c);
            });
            el.appendChild(s);
            if (i < ws.length - 1) el.appendChild(document.createTextNode(" "));
          });
          el.setAttribute("aria-label", el.getAttribute("data-t"));
        });
        function dl(ch) {
          return ".:".indexOf(ch) > -1
            ? 520
            : ch === ","
              ? 300
              : 55 + Math.random() * 45;
        }
        var T = [],
          q = $("quill"),
          fl = document.querySelector(".flourish"),
          sl = $("seal"),
          fin = $("final"),
          sky = $("sky"),
          pg = document.querySelector(".page");
        function later(f, ms) {
          T.push(setTimeout(f, ms));
        }
        function reset() {
          clearTimeout(timer);
          T.forEach(clearTimeout);
          T = [];
          hint.classList.remove("show");
          fl.classList.remove("go");
          sl.classList.remove("on");
          fin.classList.remove("on");
          pg.classList.remove("dim");
          q.style.opacity = 0;
          finaleUntil = 0;
          hp = 0;
          sky.classList.remove("on");
          document.querySelectorAll(".kw").forEach(function (w) {
            w.classList.remove("shine");
          });
          chars.forEach(function (c) {
            c.classList.remove("on");
          });
        }
        function finale() {
          fl.classList.add("go");
          later(function () {
            sl.classList.add("on");
            thud();
          }, 1900);
          later(function () {
            pg.classList.add("dim");
            sky.classList.add("on");
            heartInit();
            ht0 = performance.now();
            hp = 1;
            chimeSoft();
          }, 3300);
          later(function () {
            fin.classList.add("on");
            finaleUntil = performance.now() + 7000;
          }, 7000);
          later(function () {
            hp = 2;
            ho0 = performance.now();
          }, 11800);
          later(function () {
            fin.classList.remove("on");
          }, 14000);
          later(function () {
            sky.classList.remove("on");
            pg.classList.remove("dim");
            hint.classList.add("show");
          }, 15200);
          later(function () {
            hp = 0;
          }, 17200);
        }
        function drop(px, py) {
          var d = document.createElement("div");
          d.className = "drop";
          d.style.left = px + "px";
          d.style.top = py + "px";
          document.body.appendChild(d);
          setTimeout(function () {
            d.remove();
          }, 1700);
        }
        function write() {
          reset();
          if (reduce) {
            chars.forEach(function (c) {
              c.classList.add("on");
            });
            fl.classList.add("go");
            sl.classList.add("on");
            hint.classList.add("show");
            return;
          }
          var i = 0,
            lastBl = null,
            ready = false;
          (function st() {
            if (i >= chars.length) {
              q.style.opacity = 0;
              timer = setTimeout(finale, 700);
              return;
            }
            var c = chars[i],
              r = c.getBoundingClientRect(),
              bl = r.top + r.height * 0.8;
            if (lastBl !== null && Math.abs(bl - lastBl) > 14 && !ready) {
              ready = true;
              qlift = 1;
              qtx = r.left;
              qty = bl;
              timer = setTimeout(st, 300);
              return;
            }
            ready = false;
            i++;
            lastBl = bl;
            var t = c.textContent;
            c.classList.add("on");
            if (c.dataset.kw) {
              c.parentNode.classList.add("shine");
              chime();
            }
            qtx = r.right;
            qty = bl;
            if (q.style.opacity !== "1") {
              qx = r.left;
              qy = bl;
              q.style.opacity = 1;
            }
            scratch();
            if (t === ".") drop(r.right, bl);
            timer = setTimeout(
              st,
              dl(t) * (c.parentNode.classList.contains("kw") ? 1.6 : 1),
            );
          })();
        }

        var going = false;
        $("enter").addEventListener("click", function () {
          if (going) return;
          going = true;
          startMusic();
          askMotion();
          whoosh();
          rushT = 1;
          var wl = $("welcome"),
            bl = $("bloom"),
            lt = $("letter"),
            k = reduce ? 0.1 : 1;
          wl.classList.add("leaving");
          setTimeout(function () {
            bl.classList.add("in");
          }, 1300 * k);
          setTimeout(function () {
            wl.style.display = "none";
            paper();
            lt.classList.add("on");
            $("snd").classList.add("show");
            $("xbtn").classList.add("show");
            rushT = 0;
            bl.classList.remove("in");
            bl.classList.add("out");
          }, 2900 * k);
          setTimeout(function () {
            hint.textContent = "Toca el sello para abrir la carta";
            hint.classList.add("show");
          }, 4300 * k);
        });
        var opened = false,
          env = $("env"),
          exiting = false;
        $("xbtn").addEventListener("click", function (e) {
          e.stopPropagation();
          if (exiting || !going) return;
          exiting = true;
          reset();
          rushT = 1;
          whoosh();
          var wl = $("welcome"),
            bl = $("bloom"),
            lt = $("letter"),
            k = reduce ? 0.1 : 1;
          lt.classList.add("closing");
          setTimeout(function () {
            bl.classList.remove("out");
            bl.classList.add("in");
          }, 700 * k);
          setTimeout(function () {
            lt.classList.remove("on", "opened", "closing");
            env.className = "env";
            opened = false;
            wl.classList.remove("leaving");
            wl.style.display = "";
            $("snd").classList.remove("show");
            $("xbtn").classList.remove("show");
            hint.classList.remove("show");
            bl.classList.remove("in");
            bl.classList.add("out");
            rushT = 0;
            going = false;
            exiting = false;
          }, 2400 * k);
        });
        function spawnWax(cx, cy) {
          if (reduce) return;
          for (var i = 0; i < 14; i++) {
            var w = document.createElement("div");
            w.className = "wax";
            var ang = (Math.PI * 2 * i) / 14 + Math.random() * 0.4;
            var dist = 40 + Math.random() * 70;
            w.style.left = cx + "px";
            w.style.top = cy + "px";
            w.style.setProperty("--wx", Math.cos(ang) * dist + "px");
            w.style.setProperty("--wy", Math.sin(ang) * dist + 30 + "px");
            w.style.width = 4 + Math.random() * 5 + "px";
            w.style.height = w.style.width;
            document.body.appendChild(w);
            setTimeout(function (el) {
              el.remove();
            }, 1200, w);
          }
        }
        function openEnv(e) {
          if (e) e.stopPropagation();
          if (opened) return;
          opened = true;
          hint.classList.remove("show");
          var k = reduce ? 0.1 : 1;
          env.classList.add("shake");
          later(function () {
            env.classList.remove("shake");
            env.classList.add("o1");
            paper();
            thud();
            var seal = env.querySelector(".eseal");
            if (seal) {
              var r = seal.getBoundingClientRect();
              spawnWax(r.left + r.width / 2, r.top + r.height / 2);
            }
          }, 280 * k);
          later(function () {
            env.classList.add("o2");
          }, 780 * k);
          later(function () {
            env.classList.add("o3");
          }, 1500 * k);
          later(function () {
            $("letter").classList.add("opened");
          }, 2000 * k);
          later(function () {
            env.classList.add("gone");
          }, 2800 * k);
          later(function () {
            hint.textContent = "Toca para verla escribirse de nuevo";
            write();
          }, 3800 * k);
        }
        env.addEventListener("click", openEnv);
        env.addEventListener("keydown", function (e) {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            openEnv();
          }
        });
        $("letter").addEventListener("click", function () {
          if (going && opened) write();
        });
      })();
    </script>
  </body>
</html>
