<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>horizonte-de-sucesos</title>
    <style>
      /* ===== Estilos de la tarjeta ===== */
      :root {
        color-scheme: dark;
        --soft: rgba(255, 255, 255, 0.62);
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: #000;
        color: #fff;
        overflow: hidden;
        font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
        -webkit-tap-highlight-color: transparent;
      }
      canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        transition: filter 0.05s;
      }
      canvas.inv {
        filter: invert(1);
      }
      #card {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        text-align: center;
        pointer-events: none;
        opacity: 0;
        transition: opacity 2.4s ease;
        padding: 24px 24px 14vh;
      }
      #card.on {
        opacity: 1;
      }
      .names {
        font-size: clamp(1.9rem, 8.5vw, 3.2rem);
        letter-spacing: 0.2em;
        font-weight: 300;
        margin: 0;
        text-shadow:
          0 0 18px #000,
          0 0 40px #000;
      }
      .date {
        margin-top: 12px;
        font-size: clamp(0.85rem, 3.4vw, 1.05rem);
        letter-spacing: 0.45em;
        color: var(--soft);
        text-shadow: 0 0 14px #000;
      }
      #start {
        position: fixed;
        inset: 0;
        background: #000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        cursor: pointer;
        transition: opacity 1s;
        z-index: 5;
      }
      #start.off {
        opacity: 0;
        pointer-events: none;
      }
      #start i {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        border: 6px solid rgba(255, 255, 255, 0.55);
        animation: p 2.4s ease-in-out infinite;
      }
      #start span {
        font-size: 0.8rem;
        letter-spacing: 0.4em;
        color: var(--soft);
      }
      @keyframes p {
        50% {
          transform: scale(1.12);
          border-color: #fff;
        }
      }
      .btn {
        position: fixed;
        top: calc(14px + env(safe-area-inset-top, 0px));
        right: 16px;
        z-index: 4;
        background: none;
        border: 0;
        color: var(--soft);
        font: inherit;
        font-size: 0.78rem;
        letter-spacing: 0.25em;
        padding: 8px;
        cursor: pointer;
        opacity: 0;
        transition: opacity 0.8s;
      }
      .btn.on {
        opacity: 1;
      }
      #replay {
        right: auto;
        left: 16px;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <button class="btn" id="mute">SONIDO</button>
    <button class="btn" id="replay">VOLVER A VER</button>
    <div id="start"><i></i><span>TOCA PARA ABRIR</span></div>

    <script>
      /* ===== Lógica de la tarjeta ===== */
      const $ = (id) => document.getElementById(id);
      const cv = $("c"),
        ctx = cv.getContext("2d");
      const AUDIO_SRC = "audio.mp3"; // archivo local, en la misma carpeta que este HTML
      const audio = new Audio(AUDIO_SRC);
      audio.preload = "auto";
      audio.addEventListener("error", () =>
        console.error(
          "No se pudo cargar",
          AUDIO_SRC,
          "código:",
          audio.error?.code,
        ),
      );
      audio.loop = true;
      let W,
        H,
        U,
        dpr,
        cx,
        cy,
        started = false,
        t0 = 0,
        muted = false;

      /* ---- Línea de tiempo (segundos del video) ----
   bright brillo · rIn/rOut anillo (en U) · fib largo de fibras · veil velo gris con grano
   hole radio del agujero · wire malla · streak franjas verticales · inv inversión · inner aro fino
   swirl giro · cy centro vertical */
      const D = {
        bright: 1,
        rIn: 0.26,
        rOut: 0.4,
        fib: 0,
        veil: 0,
        hole: 0.26,
        wire: 0,
        streak: 0,
        inv: 0,
        inner: 0,
        swirl: 0.15,
        cy: 0.43,
        tri: 0,
        bolt: 0,
        flash: 0,
        shake: 0,
        rgb: 0,
        strobe: 0,
        warp: 0,
        rays: 0,
        zoom: 0,
      };
      const K = [
        [0, { bright: 0, rIn: 0.27, rOut: 0.38 }],
        [2.5, { bright: 0.8 }],
        [5.0, { bright: 1, rIn: 0.25, rOut: 0.42, inv: 0 }],
        [
          5.12,
          {
            fib: 1.3,
            rOut: 0.62,
            veil: 0.55,
            hole: 0.27,
            inv: 1,
            swirl: 0.4,
            cy: 0.5,
          },
        ],
        [5.7, { fib: 1.1, veil: 0.7, inv: 1 }],
        [5.82, { fib: 1.0, veil: 0.78, inv: 0, swirl: 0.25 }],
        [7.5, { fib: 0.5, veil: 0.8, hole: 0.28, rOut: 0.5 }],
        [
          7.62,
          {
            wire: 1,
            streak: 1,
            veil: 0,
            bright: 0.65,
            fib: 0.18,
            rIn: 0.27,
            rOut: 0.36,
            hole: 0.26,
            swirl: 0.05,
          },
        ],
        [8.88, { wire: 1, streak: 1, veil: 0 }],
        [
          9.0,
          {
            wire: 0,
            streak: 0,
            veil: 0.62,
            bright: 0.4,
            fib: 0.8,
            rOut: 0.5,
            hole: 0.27,
            swirl: 0.3,
          },
        ],
        [
          9.3,
          {
            veil: 0.4,
            hole: 0.2,
            rIn: 0.2,
            rOut: 0.5,
            fib: 1.7,
            bright: 1,
            swirl: 1.0,
            inner: 0.45,
          },
        ],
        [10.6, { rOut: 0.46, fib: 1.3, swirl: 0.7, inner: 0.9, veil: 0.35 }],
        [
          10.72,
          {
            wire: 1,
            streak: 1,
            inv: 1,
            veil: 0,
            inner: 0,
            fib: 0.2,
            rIn: 0.27,
            rOut: 0.36,
            hole: 0.26,
            bright: 0.7,
            swirl: 0.05,
          },
        ],
        [11.08, { wire: 1, streak: 1, inv: 1 }],
        [
          11.2,
          {
            wire: 0,
            streak: 0,
            inv: 0,
            veil: 0.75,
            hole: 0.27,
            fib: 0.6,
            rIn: 0.27,
            rOut: 0.4,
            bright: 0.4,
            swirl: 0.2,
          },
        ],
        [
          12.0,
          {
            veil: 0.55,
            hole: 0.2,
            inner: 0.55,
            rIn: 0.2,
            rOut: 0.42,
            fib: 1.5,
            bright: 1,
            swirl: 0.4,
          },
        ],
        [14.0, { veil: 0.62, hole: 0.19, inner: 1, fib: 1.7, swirl: 0.3 }],
        /* ===== ACTO II: lo brutal ===== */
        [15.0, { swirl: 2.4, rOut: 0.3, fib: 0.4, shake: 0.3 }],
        [
          16.6,
          {
            rIn: 0.2,
            rOut: 0.235,
            fib: 0.1,
            swirl: 5,
            veil: 0.2,
            shake: 0.7,
            rgb: 0.5,
          },
        ],
        [16.95, { flash: 0, shake: 1, rgb: 1 }],
        [17.0, { flash: 1 }],
        [
          17.18,
          {
            flash: 0,
            rOut: 0.85,
            fib: 3.4,
            swirl: 1.2,
            veil: 0.9,
            shake: 0.9,
            rgb: 0.9,
            inner: 0.3,
          },
        ],
        [
          18.4,
          { fib: 2.4, shake: 0.1, rgb: 0.1, veil: 0.5, rOut: 0.42, swirl: 0.5 },
        ],
        [18.9, { tri: 1, fib: 0.6, veil: 0.12, rOut: 0.36, inner: 0.8 }],
        [21.3, { tri: 1 }],
        [21.7, { tri: 0, bolt: 0, swirl: 0.9 }],
        [22.1, { bolt: 1, shake: 0.35, rgb: 0.4, veil: 0.3, fib: 1.4 }],
        [24.0, { bolt: 1, shake: 0.5, rgb: 0.6 }],
        [
          24.35,
          {
            bolt: 0,
            strobe: 1,
            shake: 1,
            rgb: 1,
            wire: 1,
            streak: 1,
            veil: 0,
            fib: 0.2,
          },
        ],
        [25.1, { strobe: 1, shake: 1, rgb: 1, wire: 1, streak: 1 }],
        [
          25.25,
          {
            strobe: 0,
            shake: 0,
            rgb: 0,
            wire: 0,
            streak: 0,
            veil: 0.62,
            fib: 1.7,
            swirl: 0.3,
            rOut: 0.42,
            inner: 1,
          },
        ],
        [28.0, { veil: 0.62, inner: 1 }],
        /* ===== ACTO III: el viaje y la corona ===== */
        [30.0, { swirl: 1.2, rays: 0.25, bright: 1 }],
        [
          30.5,
          {
            warp: 1,
            rays: 0.4,
            veil: 0.25,
            swirl: 2.5,
            shake: 0.25,
            zoom: 0.05,
          },
        ],
        [
          32.6,
          {
            warp: 1,
            zoom: 0.35,
            shake: 0.7,
            rgb: 0.5,
            veil: 0.1,
            fib: 0.8,
            swirl: 4,
          },
        ],
        [32.95, { flash: 0, zoom: 0.5, shake: 1, rgb: 1 }],
        [33.0, { flash: 1 }],
        [
          33.15,
          {
            flash: 0,
            warp: 0,
            zoom: 0,
            shake: 0.9,
            rgb: 0.8,
            rOut: 0.9,
            fib: 3.6,
            veil: 0.85,
            swirl: 1.2,
            rays: 1,
            inner: 0.6,
          },
        ],
        [34.6, { shake: 0.12, rgb: 0.1, fib: 2.4, rOut: 0.5, veil: 0.5 }],
        [
          37.0,
          {
            fib: 2,
            rays: 0.9,
            veil: 0.55,
            rOut: 0.44,
            shake: 0,
            rgb: 0,
            swirl: 0.4,
          },
        ],
        [40.0, { rays: 0.55, veil: 0.62, fib: 1.7, rOut: 0.42, inner: 1 }],
      ];
      // completa cada keyframe con el estado anterior
      const KF = [];
      let cur = Object.assign({}, D);
      K.forEach(([t, o]) => {
        cur = Object.assign({}, cur, o);
        KF.push({ t, s: cur });
      });
      const KEYS = Object.keys(D);
      function sceneAt(t) {
        t = Math.min(t, 40);
        let i = 0;
        while (i < KF.length - 2 && t >= KF[i + 1].t) i++;
        const a = KF[i],
          b = KF[i + 1];
        const k = Math.min(1, Math.max(0, (t - a.t) / (b.t - a.t))),
          e = k * k * (3 - 2 * k);
        const o = {};
        KEYS.forEach((n) => (o[n] = a.s[n] + (b.s[n] - a.s[n]) * e));
        return o;
      }

      /* ---- Partículas (ordenadas por ángulo para poder tejer la malla) ---- */
      const N = 5200;
      const P = Array.from({ length: N }, () => ({
        a: Math.random() * 6.2832,
        u: Math.random(),
        v: Math.random(),
        ph: Math.random() * 99,
        sp: 0.5 + Math.random() * 1.1,
        fb: Math.random() < 0.55,
        px: 0,
        py: 0,
      })).sort((p, q) => p.a - q.a);
      const X = new Float32Array(N),
        Y = new Float32Array(N);

      /* ---- Grano para el velo ---- */
      const grain = document.createElement("canvas");
      grain.width = grain.height = 256;
      (function () {
        const g = grain.getContext("2d"),
          d = g.createImageData(256, 256);
        for (let i = 0; i < d.data.length; i += 4) {
          const v = Math.random() < 0.5 ? 0 : 120 + Math.random() * 135;
          d.data[i] = d.data[i + 1] = d.data[i + 2] = v;
          d.data[i + 3] = 255;
        }
        g.putImageData(d, 0, 0);
      })();
      let pat;
      const STR = Array.from({ length: 26 }, (_, i) => ({
        x: i % 2 ? 0.02 + Math.random() * 0.18 : 0.72 + Math.random() * 0.26,
        w: 0.6 + Math.random() * 2.4,
        l: Math.random(),
      }));

      function resize() {
        dpr = Math.min(devicePixelRatio || 1, 2);
        W = innerWidth;
        H = innerHeight;
        cv.width = W * dpr;
        cv.height = H * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        U = Math.min(W, H * 0.5625);
        cx = W / 2;
        pat = ctx.createPattern(grain, "repeat");
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, W, H);
      }
      addEventListener("resize", resize);
      resize();

      function draw(now) {
        const T = now / 1000,
          t = started ? (now - t0) / 1000 : 0;
        const s = sceneAt(t);
        cy = H * s.cy;
        {
          const f = Math.floor(T * 24),
            rnd = (a, b) => {
              const x = Math.sin(a * 127.1 + b * 311.7) * 43758.5453;
              return x - Math.floor(x);
            };
          let fl = s.inv > 0.5 ? "invert(1) " : "";
          if (s.rgb > 0.03) {
            const o = 1 + s.rgb * 7 * rnd(f, 3);
            fl +=
              "drop-shadow(" +
              o +
              "px 0 0 rgba(255,0,70,.85)) drop-shadow(" +
              -o +
              "px 0 0 rgba(0,255,255,.85))";
          }
          cv.style.filter = fl;
          cv.style.transform =
            s.shake > 0.02 || s.zoom > 0.01
              ? "translate(" +
                (rnd(f, 1) - 0.5) * s.shake * 30 +
                "px," +
                (rnd(f, 2) - 0.5) * s.shake * 30 +
                "px) scale(" +
                ((s.shake > 0.02 ? 1.04 : 1) + s.zoom) +
                ")"
              : "";
        }

        // estela
        ctx.globalCompositeOperation = "source-over";
        ctx.fillStyle = "rgba(0,0,0," + (s.wire > 0.5 ? 0.5 : 0.2) + ")";
        ctx.fillRect(0, 0, W, H);

        // velo gris con grano
        if (s.veil > 0.01) {
          ctx.save();
          ctx.globalCompositeOperation = "lighter";
          ctx.globalAlpha = s.veil * 0.5;
          ctx.translate(Math.random() * 256, Math.random() * 256);
          ctx.fillStyle = pat;
          ctx.fillRect(-256, -256, W + 512, H + 512);
          ctx.restore();
          // luz cerca del agujero y esquinas oscuras
          const g = ctx.createRadialGradient(
            cx,
            cy,
            s.hole * U,
            cx,
            cy,
            Math.max(W, H) * 0.75,
          );
          g.addColorStop(0, "rgba(255,255,255," + 0.3 * s.veil + ")");
          g.addColorStop(0.35, "rgba(255,255,255,0)");
          ctx.globalCompositeOperation = "lighter";
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, W, H);
          const v = ctx.createRadialGradient(
            cx,
            cy,
            U * 0.4,
            cx,
            cy,
            Math.max(W, H) * 0.8,
          );
          v.addColorStop(0, "rgba(0,0,0,0)");
          v.addColorStop(1, "rgba(0,0,0,.55)");
          ctx.globalCompositeOperation = "source-over";
          ctx.fillStyle = v;
          ctx.fillRect(0, 0, W, H);
        }
        // agujero negro
        if (s.hole > 0.05) {
          const h = ctx.createRadialGradient(
            cx,
            cy,
            s.hole * U * 0.93,
            cx,
            cy,
            s.hole * U * 1.07,
          );
          h.addColorStop(0, "#000");
          h.addColorStop(1, "rgba(0,0,0,0)");
          ctx.globalCompositeOperation = "source-over";
          ctx.fillStyle = h;
          ctx.beginPath();
          ctx.arc(cx, cy, s.hole * U * 1.08, 0, 6.2832);
          ctx.fill();
        }

        // partículas: trazos cortos siguiendo el giro → fibras
        ctx.globalCompositeOperation = "lighter";
        ctx.lineCap = "round";
        const wire = s.wire,
          thick = s.rOut - s.rIn;
        ctx.lineWidth = wire > 0.5 ? 0.5 : 0.75;
        for (let i = 0; i < N; i++) {
          const p = P[i];
          const ang =
            p.a +
            T * s.swirl * p.sp * (p.fb ? 1.3 : 0.7) +
            Math.sin(T * 0.6 + p.ph) * 0.08;
          let r = s.rIn + thick * Math.pow(p.u, 1.4) * (p.fb ? 0.55 : 1);
          if (p.fb) r = s.rOut * 0.88 + p.v * p.v * s.fib * U * 0.3;
          r *=
            1 +
            Math.sin(ang * 7 + T * 1.1 + p.ph) * 0.018 * (1 + s.fib) +
            Math.sin(ang * 19 - T * 0.8) * 0.01;
          const x = cx + Math.cos(ang) * r * U,
            y = cy + Math.sin(ang) * r * U;
          X[i] = x;
          Y[i] = y;
          if (wire < 0.5) {
            const a = Math.min(
              1,
              s.bright *
                (p.fb ? 0.22 : 0.5) *
                (0.5 + 0.5 * Math.sin(T * 2 + p.ph)),
            );
            ctx.strokeStyle = "rgba(255,255,255," + a + ")";
            ctx.beginPath();
            ctx.moveTo(p.px || x, p.py || y);
            ctx.lineTo(x, y);
            ctx.stroke();
          }
          p.px = x;
          p.py = y;
        }
        // malla
        if (wire > 0.02) {
          ctx.strokeStyle = "rgba(200,255,238," + 0.5 * wire + ")";
          ctx.lineWidth = 0.6;
          ctx.beginPath();
          for (let i = 0; i < N - 12; i += 2)
            for (const k of [1, 4, 11]) {
              ctx.moveTo(X[i], Y[i]);
              ctx.lineTo(X[i + k], Y[i + k]);
            }
          ctx.stroke();
        }
        // aro fino brillante del halo
        if (s.inner > 0.02) {
          ctx.strokeStyle = "rgba(255,255,255," + s.inner + ")";
          ctx.lineWidth = U * 0.011;
          ctx.shadowBlur = 14 * dpr;
          ctx.shadowColor = "#fff";
          ctx.beginPath();
          for (let k = 0; k <= 120; k++) {
            const a = (k / 120) * 6.2832,
              r = (s.hole * 1.07 + Math.sin(a * 9 + T) * 0.003) * U;
            k
              ? ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r)
              : ctx.moveTo(cx + r, cy);
          }
          ctx.stroke();
          ctx.shadowBlur = 0;
        }
        // franjas verticales (glitch)
        if (s.streak > 0.02) {
          const f = Math.floor(T * 12);
          STR.forEach((q, i) => {
            const x = (q.x + Math.sin(f * 1.7 + i) * 0.004) * W;
            ctx.fillStyle =
              i % 5
                ? "rgba(255,255,255," + 0.45 * s.streak + ")"
                : "rgba(120,255,220," + 0.3 * s.streak + ")";
            ctx.fillRect(x, 0, q.w, H);
          });
        }
        const f2 = Math.floor(T * 22),
          rn = (a, b) => {
            const x = Math.sin(a * 127.1 + b * 311.7) * 43758.5453;
            return x - Math.floor(x);
          };
        ctx.globalCompositeOperation = "lighter";
        // ondas de choque
        for (const ts of [5.12, 9.3, 10.72, 17.0, 17.35, 24.4]) {
          const dt = t - ts;
          if (started && dt > 0 && dt < 1.7) {
            const k = 1 - dt / 1.7;
            ctx.strokeStyle = "rgba(255,255,255," + 0.85 * k + ")";
            ctx.lineWidth = 1 + k * 9;
            ctx.beginPath();
            ctx.arc(cx, cy, dt * U * 1.6 + s.hole * U, 0, 6.2832);
            ctx.stroke();
          }
        }
        // triángulos magnéticos
        if (s.tri > 0.02) {
          ctx.shadowBlur = 12 * dpr;
          ctx.shadowColor = "#fff";
          ctx.lineWidth = 1.3;
          for (let k = 0; k < 6; k++) {
            const rr = U * (0.2 + k * 0.075) * (1 + 0.05 * Math.sin(T * 2 + k)),
              rot = T * (0.35 + k * 0.14) * (k % 2 ? -1 : 1);
            ctx.strokeStyle =
              "rgba(255,255,255," + s.tri * (0.85 - k * 0.1) + ")";
            ctx.beginPath();
            for (let j = 0; j <= 3; j++) {
              const a = rot + j * 2.0944 - 1.5708;
              j
                ? ctx.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr)
                : ctx.moveTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr);
            }
            ctx.stroke();
          }
          ctx.shadowBlur = 0;
        }
        // rayos del campo magnético
        if (s.bolt > 0.02) {
          ctx.lineWidth = 1.5;
          ctx.shadowBlur = 10 * dpr;
          ctx.shadowColor = "#9ff";
          for (let b = 0; b < 9; b++) {
            let a = (b / 9) * 6.2832 + rn(f2, b) * 0.5,
              r = s.hole * U;
            ctx.strokeStyle =
              "rgba(" +
              (b % 3 ? "255,255,255" : "140,255,230") +
              "," +
              s.bolt * (0.35 + 0.65 * rn(f2, b + 9)) +
              ")";
            ctx.beginPath();
            ctx.moveTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
            for (let i = 0; i < 16; i++) {
              r += U * (0.035 + 0.03 * rn(f2, b * 17 + i));
              a += (rn(f2, b * 31 + i) - 0.5) * 0.22;
              ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
            }
            ctx.stroke();
          }
          ctx.shadowBlur = 0;
        }
        // hiperviaje: estrellas que atraviesan el agujero
        if (s.warp > 0.02) {
          const M = Math.max(W, H);
          ctx.lineWidth = 1.3;
          for (let i = 0; i < 240; i++) {
            const a = rn(i, 1) * 6.2832,
              ph = (rn(i, 2) + T * (0.35 + rn(i, 3) * 0.8) * (1 + s.warp)) % 1,
              r1 = s.hole * U * 0.7 + Math.pow(ph, 2.3) * M,
              r0 = r1 - (0.05 + 0.3 * ph) * M * 0.35 * s.warp;
            ctx.strokeStyle =
              "rgba(" +
              (i % 7 ? "255,255,255" : "150,255,235") +
              "," +
              ph * s.warp * 0.9 +
              ")";
            ctx.beginPath();
            ctx.moveTo(
              cx + Math.cos(a) * Math.max(r0, 0),
              cy + Math.sin(a) * Math.max(r0, 0),
            );
            ctx.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
            ctx.stroke();
          }
        }
        // corona: rayos de luz y cometas orbitales
        if (s.rays > 0.02) {
          const M = Math.max(W, H);
          for (let k = 0; k < 30; k++) {
            const a = (k / 30) * 6.2832 + T * 0.12 * (k % 2 ? 1 : -0.6),
              r0 = s.hole * U * 1.12;
            ctx.strokeStyle =
              "rgba(255,255,255," +
              s.rays * 0.09 * (0.4 + 0.6 * Math.sin(k * 3.1 + T * 1.8) ** 2) +
              ")";
            ctx.lineWidth = 3 + (k % 4) * 5;
            ctx.beginPath();
            ctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0);
            ctx.lineTo(
              cx + Math.cos(a) * M * (0.55 + 0.25 * rn(k, 5)),
              cy + Math.sin(a) * M * (0.55 + 0.25 * rn(k, 5)),
            );
            ctx.stroke();
          }
          ctx.lineWidth = 2;
          ctx.lineCap = "round";
          for (let c = 0; c < 5; c++) {
            const sp = 0.5 + c * 0.17,
              rr = U * (0.52 + 0.17 * Math.sin(T * 0.7 + c)),
              ph0 = c * 1.3;
            for (let i = 0; i < 26; i++) {
              const a1 = T * sp + ph0 - i * 0.035,
                a2 = a1 - 0.035;
              ctx.strokeStyle =
                "rgba(255,255,255," + s.rays * (1 - i / 26) * 0.9 + ")";
              ctx.beginPath();
              ctx.moveTo(cx + Math.cos(a1) * rr, cy + Math.sin(a1) * rr * 0.92);
              ctx.lineTo(cx + Math.cos(a2) * rr, cy + Math.sin(a2) * rr * 0.92);
              ctx.stroke();
            }
          }
        }
        // destello y estroboscopio
        {
          const fa = Math.max(s.flash, s.strobe * (f2 % 2 ? 0.85 : 0));
          if (fa > 0.01) {
            ctx.globalCompositeOperation = "source-over";
            ctx.fillStyle = "rgba(255,255,255," + fa + ")";
            ctx.fillRect(0, 0, W, H);
          }
        }
        // tarjeta final y botones
        if (started && t > 39) $("replay").classList.add("on");
        requestAnimationFrame(draw);
      }
      requestAnimationFrame(draw);

      /* ---- Control ---- */
      function play() {
        started = true;
        t0 = performance.now();
        $("replay").classList.remove("on");
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, W, H);
        P.forEach((p) => (p.px = 0));
        audio.muted = muted;
        try {
          audio.currentTime = 0;
        } catch (e) {}
        const pr = audio.play();
        if (pr && pr.catch)
          pr.catch((e) =>
            console.error("No se pudo reproducir:", e.name, e.message),
          );
        $("mute").classList.add("on");
      }
      $("start").addEventListener("pointerdown", () => {
        $("start").classList.add("off");
        play();
      });
      $("replay").addEventListener("click", play);
      $("mute").addEventListener("click", () => {
        muted = !muted;
        audio.muted = muted;
        $("mute").textContent = muted ? "SIN SONIDO" : "SONIDO";
      });
    </script>
  </body>
</html>
