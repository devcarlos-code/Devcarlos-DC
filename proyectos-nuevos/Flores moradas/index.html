    <style>
  :root {
  --bg: #0f0f1a;
  --night: #141a33;
  --lila: #a855f7;
  --rosa: #c2185b;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
* {
  box-sizing: border-box;
}
html,
body {
  height: 100%;
  margin: 0;
  background: #000;
  overflow: hidden;
  font-family: "Montserrat", system-ui, sans-serif;
  -webkit-tap-highlight-color: transparent;
}
#app {
  position: relative;
  height: 100%;
  max-width: 520px;
  margin: 0 auto;
  overflow: hidden;
  background: #000;
  transition: background 2s;
}
#app.on {
  background: linear-gradient(#0f0f1a 55%, #141f3d 55%, #10152b);
}
.star {
  position: absolute;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: #fff;
  opacity: 0.35;
  animation: tw 4s infinite;
}
@keyframes tw {
  50% {
    opacity: 0.9;
  }
}
#moon {
  position: absolute;
  top: 12%;
  right: 10%;
  width: 84px;
  height: 84px;
  border-radius: 50%;
  background: #262626;
  box-shadow: 0 0 30px #1a1a1a;
  transition: all 2.5s;
}
.on #moon {
  background: radial-gradient(circle at 40% 40%, #f4faff, #e6eaf3);
  box-shadow: 0 0 40px 12px rgba(255, 255, 255, 0.55);
}
.shoot {
  position: absolute;
  width: 90px;
  height: 2px;
  background: linear-gradient(90deg, transparent, #fff);
  transform: rotate(30deg);
  opacity: 0;
}
.on .shoot {
  animation: sh 6s infinite;
}
@keyframes sh {
  0% {
    opacity: 0;
    transform: translate(0, 0) rotate(30deg);
  }
  4% {
    opacity: 1;
  }
  22% {
    opacity: 0;
    transform: translate(260px, 150px) rotate(30deg);
  }
  100% {
    opacity: 0;
  }
}
#intro {
  position: absolute;
  inset: 0;
  z-index: 5;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 28px;
  cursor: pointer;
  transition: opacity 1.2s;
}
#intro h1 {
  margin: 0;
  color: #fff;
  font-size: 28px;
  letter-spacing: 0.4em;
  text-align: center;
  line-height: 1.7;
  text-shadow:
    0 0 12px #c026d3,
    0 0 28px #7e22ce;
  padding: 0 24px;
}
#intro i {
  width: 150px;
  height: 3px;
  background: linear-gradient(90deg, transparent, #ec4899, transparent);
}
#intro .h {
  font-size: 120px;
  line-height: 1;
  filter: drop-shadow(0 0 22px #c026d3);
  animation: beat 1.6s infinite;
}
@keyframes beat {
  50% {
    transform: scale(1.08);
  }
}
.gone {
  opacity: 0;
  pointer-events: none;
}
#title {
  position: absolute;
  top: 9%;
  left: 0;
  right: 0;
  z-index: 3;
  text-align: center;
  font:
    italic 400 clamp(34px, 11vw, 52px)/1.18 "Noto Serif",
    Georgia,
    serif;
  letter-spacing: 0.14em;
  color: #a855f7;
  text-shadow: 0 0 18px rgba(168, 85, 247, 0.7);
  padding: 0 28px;
  opacity: 0;
  transition: opacity 2.5s 8s;
}
.on #title {
  opacity: 1;
}
svg#bq {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  width: 100%;
  height: 72%;
  z-index: 2;
  opacity: 0;
  transform: translateY(40px);
  transition: all 1.4s 0.6s;
}
.on svg#bq {
  opacity: 1;
  transform: none;
}
.lf {
  opacity: 0;
}
.fl {
  filter: drop-shadow(0 0 7px rgba(168, 85, 247, 0.7));
}
.cover {
  transform-origin: 200px 535px;
  transition:
    opacity 1.4s 1.1s,
    transform 1.8s 1.1s;
}
.on .cover {
  opacity: 0;
  transform: translateY(50px) scale(0.85);
}
@keyframes draw {
  to {
    stroke-dashoffset: 0;
  }
}
.on .lf {
  animation: grow 1s var(--d) forwards;
}

@keyframes rise {
  from {
    opacity: 0;
    transform: translateY(130px) scale(0.15);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes grow {
  to {
    opacity: 1;
  }
}

.sway {
  animation: sw 7s ease-in-out infinite alternate;
  transform-origin: 200px 535px;
}
@keyframes sw {
  to {
    transform: rotate(1.2deg);
  }
}
#env {
  position: absolute;
  left: 50%;
  bottom: 11%;
  width: min(240px, 48%);
  aspect-ratio: 1.5;
  transform: translateX(-50%) scale(0.6);
  z-index: 4;
  opacity: 0;
  cursor: pointer;
  transition: all 1.2s 10s;
  animation: none;
}
.on #env {
  opacity: 1;
  transform: translateX(-50%) scale(1);
  animation: fl 3s 11.5s infinite ease-in-out;
}
@keyframes fl {
  50% {
    transform: translateX(-50%) translateY(-6px);
  }
}
#env .b {
  position: absolute;
  inset: 0;
  background: #f8b4c4;
  border-radius: 12px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);

#env .t {
  position: absolute;
  inset: 0;
  background: #fbc2cc;
  clip-path: polygon(0 0, 100% 0, 50% 58%);
  border-radius: 12px 12px 0 0;

#env .l {
  position: absolute;
  left: 50%;
  top: 40%;

  color: #ff8fc7;
}

  height: 54px;

  background: #c2185b;

#letter {

  align-items: center;
  justify-content: center;
  padding: 24px;
  background: rgba(5, 5, 15, 0.8);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.6s;
}
#letter.show {
  opacity: 1;
  pointer-events: auto;
}
#card {

  overflow: auto;
  background: #fdf2f6;
  color: #3b1450;
  border-radius: 16px;

#letter.show #card {

  border-radius: 50%;
  background: #e9d5ff;

  pointer-events: none;

@keyframes ffl {

  50% {

.petal {

  }

      '<path id="br' +
      i +
      '" d="M50 104C80 98 94 66 90 38C88 26 76 22 70 30C60 44 53 66 50 86Z" fill="url(#tk)" stroke="#5a1a82" stroke-width="1.3" opacity="0"/>' +
      '<path id="pl' +
      i +
      '" d="M50 106C14 102 0 68 5 36C8 20 22 16 30 28C41 44 47 68 50 90Z" fill="url(#ts)" stroke="#4a1470" stroke-width="1.5"/>' +
      '<path id="pr' +
      i +
      '" d="M50 106C86 102 100 68 95 36C92 20 78 16 70 28C59 44 53 68 50 90Z" fill="url(#ts)" stroke="#4a1470" stroke-width="1.5"/>' +
      '<g id="pc' +
      i +
      '"><path d="M50 108C22 103 17 58 27 28C32 12 42 3 50 3C58 3 68 12 73 28C83 58 78 103 50 108Z" fill="url(#tc)" stroke="#5b1a6b" stroke-width="1.6"/>' +
      '<path id="ia' +
      i +
      '"' +
      sw +
      ' stroke="#7a1d8c" stroke-width="1.3" d="M50 98C33 94 31 58 38 34C41 24 45 17 50 16C55 17 59 24 62 34C69 58 67 94 50 98Z"/>' +
      '<path id="ib' +
      i +
      '"' +
      sw +
      ' stroke="#8a2a9c" stroke-width="1.1" d="M50 90C40 86 38 60 43 42M50 90C60 86 62 60 57 42"/>' +
      '<ellipse cx="42" cy="34" rx="9" ry="20" fill="#fff" opacity=".2" transform="rotate(8 42 34)"/></g>' +
      '<ellipse cx="50" cy="107" rx="8.5" ry="6" fill="#1a0630"/></g></g>'
    );
  }
  function bloom(i, p) {
    var bL = bk(p),
      bR = bk(p - 0.1),
      bB = sm((p - 0.2) / 0.8),
      bC = sm(p),
      I = sm((p - 0.35) / 0.65),
      I2 = sm((p - 0.5) / 0.5),
      st = function (id, k, v) {
        $(id + i).setAttribute(k, v);
      };
    st("pl", "transform", "rotate(" + ((1 - bL) * 22).toFixed(2) + " 50 106)");
    st("pr", "transform", "rotate(" + (-(1 - bR) * 22).toFixed(2) + " 50 106)");
    var rb = ((1 - bB) * 30 - 13 * bB).toFixed(2);
    st("bl", "transform", "rotate(" + rb + " 50 106)");
    st("br", "transform", "rotate(" + -rb + " 50 106)");
    st("bl", "opacity", bB);
    st("br", "opacity", bB);
    st(
      "pc",
      "transform",
      "translate(50 106) scale(" +
        (0.88 + 0.12 * bC).toFixed(3) +
        " " +
        (0.97 + 0.03 * bC).toFixed(3) +
        ") translate(-50 -106)",
    );
    $("ia" + i).style.strokeDashoffset = 1 - I;
    $("ib" + i).style.strokeDashoffset = 1 - I2;
  }
  F.forEach(function (f, i) {
    var x = f[0],
      y = f[1],
      kk = f[3] || 1,
      r = f[2] * D,
      bx = x - 37 * kk * Math.sin(r),
      by = y + 37 * kk * Math.cos(r),
      c1x = 200 + (bx - 200) * 0.12,
      c1y = 535 - (535 - by) * 0.45,
      c2x = bx - 45 * Math.sin(r),
      c2y = by + 45 * Math.cos(r),
      PX = [200, c1x, c2x, bx],
      PY = [535, c1y, c2y, by],
      d =
        "M200 535C" +
        c1x +
        " " +
        c1y +
        " " +
        c2x +
        " " +
        c2y +
        " " +
        bx +
        " " +
        by,
      lv = [];
    hs +=
      '<path id="s' +
      i +
      '" pathLength="1" style="stroke-dasharray:1;stroke-dashoffset:1" d="' +
      d +
      '" fill="none" stroke="#4f8a2b" stroke-width="5" stroke-linecap="round"/>';
    [0.24, 0.46, 0.68].forEach(function (t, j) {
      var side = (i + j) % 2 ? 1 : -1,
        sz = 1.05 + (0.3 * ((i * 3 + j) % 3)) / 2;
      lv.push({
        t: t,
        x: bz(t, PX),
        y: bz(t, PY),
        side: side,
        rot: -38 - j * 14,
        sz: sz,
      });
      ls +=
        '<g id="l' +
        i +
        "_" +
        j +
        '" opacity="0"><use href="#lv" fill="url(#lf)"/><path d="M0 0C20-3 38-5 54-6" stroke="#dcedc8" stroke-width=".9" fill="none" opacity=".5"/></g>';
    });
    hd += head(i);
    fl.push({ PX: PX, PY: PY, lv: lv, t0: G0 + i * GS, k: kk });
  });
  document.getElementById("fls").innerHTML =
    '<g class="sway">' + hs + ls + hd + "</g>";
  var gr = "";
  for (var k = 0; k < 11; k++) {
    var a = -168 + k * 14.5,
      sc = (0.55 + ((k * 7) % 5) * 0.07).toFixed(2);
    gr +=
      '<g transform="translate(200 528) rotate(' +
      a +
      ") scale(" +
      sc +
      ')"><use href="#lv" fill="#2f5d1d"/></g>';
  }
  document.getElementById("gr").innerHTML = gr;

  var $ = function (id) {
      return document.getElementById(id);
    },
    TB = G0 + (F.length - 1) * GS + GD + 0.4 * SP,
    TEND = TB + (F.length - 1) * BS + BD;
  function render(T) {
    fl.forEach(function (o, i) {
      var u = sm((T - o.t0) / GD),
        b = bk((T - TB - i * BS) / BD),
        bs = sm((T - TB - i * BS) / BD);
      $("s" + i).style.strokeDashoffset = 1 - u;
      o.lv.forEach(function (L, j) {
        var p = cl((u - L.t) / 0.2),
          e = $("l" + i + "_" + j);
        e.setAttribute("opacity", p);
        e.setAttribute(
          "transform",
          "translate(" +
            L.x.toFixed(1) +
            " " +
            L.y.toFixed(1) +
            ") scale(" +
            L.side +
            " 1) rotate(" +
            L.rot +
            ") scale(" +
            (L.sz * 0.6 * p).toFixed(3) +
            ")",
        );
      });
      var tt = Math.max(u, 0.001),
        px = bz(tt, o.PX),
        py = bz(tt, o.PY),
        ang = Math.atan2(db(tt, o.PX), -db(tt, o.PY)) / D,
        sc = 0.74 * o.k * (0.55 + 0.45 * u);
      $("f" + i).setAttribute("opacity", cl(u * 8));
      $("hp" + i).setAttribute(
        "transform",
        "translate(" +
          px.toFixed(1) +
          " " +
          py.toFixed(1) +
          ") rotate(" +
          ang.toFixed(1) +
          ") scale(" +
          sc.toFixed(3) +
          ") translate(-50 -106)",
      );
      bloom(i, (T - TB - i * BS) / BD);
    });
  }
  render(0);
  var raf;
  function startGrow() {
    var t0 = performance.now();
    (function loop(n) {
      var T = (n - t0) / 1000;
      render(T);
      if (T < TEND) raf = requestAnimationFrame(loop);
      else render(TEND);
    })(t0);
  }

  // Abrir
  var intro = document.getElementById("intro"),
    opened = false;
  function open() {
    if (opened) return;
    opened = true;
    intro.classList.add("gone");
    app.classList.add("on");
    startMusic();
    startGrow();
    setTimeout(function () {
      setInterval(petal, 900);
      fireflies();
    }, 9500);
  }
  intro.addEventListener("click", open);
  intro.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") open();
  });

  function fireflies() {
    for (var n = 0; n < 14; n++) {
      var f = document.createElement("div");
      f.className = "ff";
      f.style.left = 8 + Math.random() * 84 + "%";
      f.style.top = 38 + Math.random() * 48 + "%";
      f.style.animationDelay = Math.random() * 6 + "s";
      f.style.animationDuration = 5 + Math.random() * 4 + "s";
      app.appendChild(f);
    }
  }
  function petal() {
    var p = document.createElement("div");
    p.className = "petal";
    p.style.left = Math.random() * 100 + "%";
    p.style.setProperty("--x", Math.random() * 120 - 60 + "px");
    p.style.animationDuration = 6 + Math.random() * 5 + "s";
    app.appendChild(p);
    setTimeout(function () {
      p.remove();
    }, 11500);
  }

  // Carta
  var L = document.getElementById("letter"),
    env = document.getElementById("env");
  function showL() {
    L.classList.add("show");
  }
  env.addEventListener("click", showL);
  env.addEventListener("keydown", function (e) {
    if (e.key === "Enter") showL();
  });
  document.getElementById("close").addEventListener("click", function () {
    L.classList.remove("show");
  });
  L.addEventListener("click", function (e) {
    if (e.target === L) L.classList.remove("show");
  });

  // Música suave (generada, sin archivos externos)
  var ctx,
    timer,
    playing = false,
    btn = document.getElementById("play"),
    seq = [0, 4, 7, 12, 7, 4, 2, 5, 9, 12, 9, 5],
    k = 0;
  function note(f, t) {
    var o = ctx.createOscillator(),
      a = ctx.createGain();
    o.type = "sine";
    o.frequency.value = f;
    a.gain.setValueAtTime(0, t);
    a.gain.linearRampToValueAtTime(0.09, t + 0.05);
    a.gain.exponentialRampToValueAtTime(0.001, t + 1.8);
    o.connect(a);
    a.connect(ctx.destination);
    o.start(t);
    o.stop(t + 1.9);
  }
  function tick() {
    var f = 261.63 * Math.pow(2, seq[k % seq.length] / 12);
    note(f, ctx.currentTime);
    if (k % 4 === 0) note(f / 2, ctx.currentTime);
    k++;
  }
  function startMusic() {
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.resume) ctx.resume();
      clearInterval(timer);
      timer = setInterval(tick, 520);
      tick();
      playing = true;
      btn.textContent = "❚❚";
    } catch (e) {}
  }
  function stopMusic() {
    clearInterval(timer);
    playing = false;
    btn.textContent = "▶";
  }
  btn.addEventListener("click", function () {
    playing ? stopMusic() : startMusic();
  });
})();
    </script>
  </body>
