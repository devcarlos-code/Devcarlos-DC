<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Agujero negro 360°</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #000;
        overflow: hidden;
        touch-action: none;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }
      #c {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        cursor: grab;
      }
      #c:active {
        cursor: grabbing;
      }
      #hint {
        position: fixed;
        left: 0;
        right: 0;
        bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
        text-align: center;
        color: #fff;
        opacity: 0.6;
        font-size: 13px;
        letter-spacing: 0.02em;
        pointer-events: none;
        transition: opacity 1.2s;
      }
      #mode {
        position: fixed;
        top: calc(env(safe-area-inset-top, 0px) + 14px);
        right: 14px;
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 999px;
        padding: 8px 14px;
        font-size: 13px;
        backdrop-filter: blur(6px);
        cursor: pointer;
      }
      #mode:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 2px;
      }
      #msg {
        position: fixed;
        inset: 0;
        display: none;
        place-items: center;
        color: #fff;
        text-align: center;
        padding: 24px;
      }
    </style>
  </head>
  <body>
    <canvas
      id="c"
      aria-label="Agujero negro interactivo en 360 grados"
    ></canvas>
    <button id="mode" type="button">Color</button>
    <div id="hint">
      Arrastra para orbitar 360° · pellizca o usa la rueda para acercar
    </div>
    <div id="msg">Tu navegador no admite WebGL.</div>
    <script>
      const FRAG = `
precision highp float;
uniform vec2 R; uniform float T,yaw,pitch,dist,col;
uniform vec3 OP[10]; uniform vec3 TD[10]; uniform float OR[10];
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float h3(vec3 p){p=fract(p*.3183099+.1);p*=17.;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
float stars(vec3 d){
  float s=0.;
  for(int k=0;k<2;k++){
    vec3 p=d*(k==0?38.:75.); vec3 c=floor(p); vec3 f=fract(p)-.5;
    float r=h3(c+float(k)*7.);
    vec3 o=(vec3(h3(c+1.),h3(c+2.),h3(c+3.))-.5)*.6;
    s+=step(.955,r)*smoothstep(.22,0.,length(f-o))*(.25+r*r*1.6);
  }
  return s;
}
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*R)/min(R.x,R.y);
  vec3 ro=dist*vec3(cos(pitch)*sin(yaw),sin(pitch),-cos(pitch)*cos(yaw));
  vec3 fw=normalize(-ro), rt=normalize(cross(vec3(0,1,0),fw)), up=cross(fw,rt);
  vec3 rd=normalize(rt*uv.x*.8+up*uv.y*.8+fw);
  vec3 pos=ro, vel=rd;
  vec3 hh=cross(pos,vel); float h2=dot(hh,hh);
  float pa=T*.35; vec3 pc=vec3(cos(pa),0.,sin(pa))*7.5; float PR=.24;
  vec3 C=vec3(0.); float tr=1., minr=99., lastr=0.;
  for(int i=0;i<190;i++){
    float r=length(pos); minr=min(minr,r);
    if(r<.98){tr=0.;break;}
    if(r>30.&&dot(pos,vel)>0.) break;
    float dt=clamp(.06*r,.04,.9);
    float dt0=dt;
    dt=min(dt,max(.03,(length(pos-pc)-PR)*.7));
    if(r<12.&&abs(pos.y)<3.5){
      for(int k=0;k<10;k++){
        vec3 q=pos-OP[k]; float d=length(q);
        dt=min(dt,max(.03,(d-OR[k])*.65));
        if(k>=7){
          float sg=dot(q,TD[k]);
          if(sg>0.&&sg<5.){
            float pp=length(q-TD[k]*sg); float wd=.04+.09*sg;
            C+=tr*vec3(exp(-pp*pp/(wd*wd))*exp(-sg*.7)*dt0*2.4+exp(-d*d/.012)*dt0*1.5);
          }
        }
        if(d<OR[k]){
          if(k>=7){C+=tr*vec3(3.);}
          else{
            vec3 n=q/d; vec3 L=normalize(-OP[k]);
            float lit=.03+.95*pow(max(dot(n,L),0.),1.4)*min(1.6,4.5/(length(OP[k])+.5));
            lit*=.55+.9*vn(n.xy*7.+n.z*5.+float(k)*3.1);
            C+=tr*vec3(lit);
          }
          tr=0.; break;
        }
      }
      if(tr==0.) break;
    }
    vec3 acc=-1.5*h2*pos/(r*r*r*r*r);
    vec3 np=pos+vel*dt; vel=normalize(vel+acc*dt);
    // gas tenue sobre el plano del disco (volumen)
    float rr0=length(np.xz);
    float gas=abs(np.y)>1.3?0.:exp(-np.y*np.y*5.)*smoothstep(1.6,2.4,rr0)*smoothstep(10.,4.,rr0)/(rr0+.5);
    if(abs(np.y)<1.3) C+=tr*vec3(gas*dt*.22);
    if(length(np-pc)<PR){C+=tr*vec3(.01);tr=0.;break;}
    if(pos.y*np.y<0.){
      float t=pos.y/(pos.y-np.y); vec3 hit=mix(pos,np,t);
      float rr=length(hit.xz);
      if(rr>1.5&&rr<11.){
        float ang=atan(hit.z,hit.x);
        float w=1.6/(rr*sqrt(rr));
        float a2=ang-T*w+1.4*log(rr);
        vec2 P=rr*vec2(cos(a2),sin(a2));
        float ring=vn(vec2(rr*34.,1.))*.45+vn(vec2(rr*11.,2.))*.35+vn(vec2(rr*80.,3.))*.2;
        float blob=.5+1.0*vn(P*2.2)*vn(P*5.3+3.)+.35*vn(P*13.);
        float n=ring*blob;
        vec3 tg=normalize(vec3(-hit.z,0.,hit.x));
        float dop=dot(tg,-vel)*min(1.,1.9/sqrt(rr));
        float beam=pow(clamp(1.+.95*dop,.12,2.4),2.6);
        float gred=sqrt(max(1.-1./rr,.05));
        float edge=smoothstep(1.5,2.3,rr)*smoothstep(11.,5.,rr);
        float e=edge*(4.4/(rr*1.1))*n*beam*gred;
        C+=tr*vec3(e); tr*=.6;
        lastr=rr;
      }
    }
    pos=np;
  }
  C+=tr*vec3(stars(normalize(vel)))*.9;
  float ph=exp(-pow((minr-1.5)/.18,2.))*.9;
  C+=tr*vec3(ph)*.5 + vec3(.55)/(minr*minr*minr+.45)*.12*tr;
  vec3 tint=vec3(1.);
  if(col>.5){
    float m=clamp(length(C)*.35,0.,1.);
    tint=mix(vec3(1.,.42,.12),vec3(1.,.93,.82),pow(m,.6));
  }
  vec3 g=1.-exp(-C*tint*1.3);
  g=pow(clamp(g,0.,1.),vec3(.92));
  g+=(h(gl_FragCoord.xy+T)-.5)*.02;
  g*=1.-.3*dot(uv,uv);
  gl_FragColor=vec4(clamp(g,0.,1.),1.);
}`;
      const c = document.getElementById("c");
      const gl = c.getContext("webgl", { antialias: false });
      if (!gl) {
        document.getElementById("msg").style.display = "grid";
      } else {
        const sh = (t, s) => {
          const o = gl.createShader(t);
          gl.shaderSource(o, s);
          gl.compileShader(o);
          return o;
        };
        const pr = gl.createProgram();
        gl.attachShader(
          pr,
          sh(
            gl.VERTEX_SHADER,
            "attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}",
          ),
        );
        gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FRAG));
        gl.linkProgram(pr);
        gl.useProgram(pr);
        gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
        gl.bufferData(
          gl.ARRAY_BUFFER,
          new Float32Array([-1, -1, 3, -1, -1, 3]),
          gl.STATIC_DRAW,
        );
        const loc = gl.getAttribLocation(pr, "a");
        gl.enableVertexAttribArray(loc);
        gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
        const U = (n) => gl.getUniformLocation(pr, n);
        const uOP = U("OP[0]"),
          uTD = U("TD[0]"),
          uOR = U("OR[0]");
        const hh = (x, y) => {
          const v = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
          return v - Math.floor(v);
        };
        const OPa = new Float32Array(30),
          TDa = new Float32Array(30),
          ORa = new Float32Array(10);
        function objs(T) {
          for (let k = 0; k < 10; k++) {
            const cm = k >= 7;
            const rk = cm ? 4.8 + (k - 7) * 2.6 : 3.0 + 7.0 * hh(k, 1);
            const a = 6.283 * hh(k, 2) + (T * 3.2) / (rk * Math.sqrt(rk));
            const inc = (hh(k, 3) - 0.5) * (cm ? 0.6 : 0.22);
            let x = Math.cos(a) * rk,
              y = 0,
              z = Math.sin(a) * rk;
            const yy = y * Math.cos(inc) - z * Math.sin(inc),
              zz = y * Math.sin(inc) + z * Math.cos(inc);
            y = yy;
            z = zz;
            OPa.set([x, y, z], k * 3);
            ORa[k] = cm ? 0.09 : 0.07 + 0.13 * hh(k, 4);
            const l = Math.hypot(x, y, z),
              rx = x / l,
              ry = y / l,
              rz = z / l;
            // tangente = cross(rad, up)
            const tx = -rz,
              ty = 0,
              tz = rx;
            let dx = rx - 0.7 * tx,
              dy = ry - 0.7 * ty,
              dz = rz - 0.7 * tz;
            const dl = Math.hypot(dx, dy, dz);
            TDa.set([dx / dl, dy / dl, dz / dl], k * 3);
          }
          gl.uniform3fv(uOP, OPa);
          gl.uniform3fv(uTD, TDa);
          gl.uniform1fv(uOR, ORa);
        }
        const uR = U("R"),
          uT = U("T"),
          uY = U("yaw"),
          uP = U("pitch"),
          uD = U("dist"),
          uC = U("col");

        let yaw = 0.35,
          pitch = 0.13,
          dist = 14,
          vy = 0,
          vp = 0,
          tDist = 14,
          color = 0,
          idle = 0,
          scale = 0.9;
        const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
        function size() {
          const d = Math.min(devicePixelRatio || 1, 1.5) * scale;
          c.width = Math.max(2, Math.round(innerWidth * d));
          c.height = Math.max(2, Math.round(innerHeight * d));
          gl.viewport(0, 0, c.width, c.height);
        }
        addEventListener("resize", size);
        size();

        // interacción: 1 dedo/ratón orbita, 2 dedos/rueda zoom
        const ptr = new Map();
        let pinch = 0;
        const hint = document.getElementById("hint");
        c.addEventListener("pointerdown", (e) => {
          c.setPointerCapture(e.pointerId);
          ptr.set(e.pointerId, [e.clientX, e.clientY]);
          hint.style.opacity = 0;
          idle = 0;
          if (ptr.size == 2) {
            const [a, b] = [...ptr.values()];
            pinch = Math.hypot(a[0] - b[0], a[1] - b[1]);
          }
        });
        c.addEventListener("pointermove", (e) => {
          const p = ptr.get(e.pointerId);
          if (!p) return;
          const dx = e.clientX - p[0],
            dy = e.clientY - p[1];
          if (ptr.size == 1) {
            vy = -dx * 0.0055;
            vp = dy * 0.0055;
            yaw += vy;
            pitch += vp;
          }
          ptr.set(e.pointerId, [e.clientX, e.clientY]);
          if (ptr.size == 2) {
            const [a, b] = [...ptr.values()];
            const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
            tDist = Math.min(40, Math.max(5, (tDist * pinch) / d));
            pinch = d;
          }
        });
        const up = (e) => {
          ptr.delete(e.pointerId);
          idle = 0;
        };
        c.addEventListener("pointerup", up);
        c.addEventListener("pointercancel", up);
        c.addEventListener(
          "wheel",
          (e) => {
            e.preventDefault();
            tDist = Math.min(
              40,
              Math.max(5, tDist * Math.exp(e.deltaY * 0.001)),
            );
          },
          { passive: false },
        );
        document.getElementById("mode").onclick = (e) => {
          color ^= 1;
          e.target.textContent = color ? "Blanco y negro" : "Color";
        };

        const t0 = performance.now();
        let last = t0,
          fr = 0,
          acc = 0;
        (function loop(now) {
          const dtm = now - last;
          last = now;
          acc += dtm;
          fr++;
          if (fr == 45) {
            const ms = acc / fr;
            acc = 0;
            fr = 0;
            if (ms > 25 && scale > 0.5) {
              scale = Math.max(0.5, scale * 0.9);
              size();
            } else if (ms < 17.8 && scale < 1) {
              scale = Math.min(1, scale * 1.07);
              size();
            }
          }
          if (!ptr.size) {
            yaw += vy;
            pitch += vp;
            vy *= 0.95;
            vp *= 0.95;
            idle += dtm;
            if (idle > 2500 && !still) yaw += 0.0016;
          }
          pitch = Math.max(-1.5, Math.min(1.5, pitch));
          dist += (tDist - dist) * 0.12;
          gl.uniform2f(uR, c.width, c.height);
          const tt = still ? 3 : (now - t0) / 1000;
          gl.uniform1f(uT, tt);
          objs(tt);
          gl.uniform1f(uY, yaw);
          gl.uniform1f(uP, pitch);
          gl.uniform1f(uD, dist);
          gl.uniform1f(uC, color);
          gl.drawArrays(gl.TRIANGLES, 0, 3);
          requestAnimationFrame(loop);
        })(t0);
      }
    </script>
  </body>
</html>
